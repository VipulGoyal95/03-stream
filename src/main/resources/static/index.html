<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Travel Concierge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
</head>

<body>
    <div class="container d-flex justify-content-center py-5">
        <div class="card w-100" style="max-width:680px;">
            <div class="card-header text-white" style="background-color:#003580;">
                &#9992;&#65039; AI Travel Concierge &mdash; Enhance Your Journey
            </div>
            <div class="card-body">

                <div class="mb-3">
                    <label for="question" class="form-label">Ask your travel question</label>
                    <input type="text" id="question" class="form-control"
                        placeholder="e.g. What should I do if my connecting flight is delayed at Heathrow?"
                        required autofocus>
                </div>

                <div class="row g-2 mb-3">
                    <div class="col">
                        <div class="d-grid">
                            <button onclick="askQuestion()" id="submitButton" class="btn btn-primary">Call (wait)</button>
                        </div>
                    </div>
                    <div class="col">
                        <div class="d-grid">
                            <button onclick="streamQuestion()" id="streamButton" class="btn btn-success">Stream (live)</button>
                        </div>
                    </div>
                </div>

                <div id="loading" class="mt-3 text-center visually-hidden">Loading...</div>
                <div id="error" class="alert alert-danger mt-3 d-none"></div>
                <div id="answer" class="mt-3 text-muted"
                    style="max-height:480px; overflow-y:auto;">Your personalised travel guidance will appear here...</div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>
    <script>
        const questionInput = document.getElementById('question');
        const submitButton  = document.getElementById('submitButton');
        const streamButton  = document.getElementById('streamButton');
        const loadingDiv    = document.getElementById('loading');
        const errorDiv      = document.getElementById('error');
        const answerDiv     = document.getElementById('answer');
        const apiUrl        = "/api/chat";
        const streamUrl     = "/api/stream";

        function showLoading() { loadingDiv.classList.remove('visually-hidden'); }
        function hideLoading() { loadingDiv.classList.add('visually-hidden'); }

        async function askQuestion() {
            const question = questionInput.value.trim();
            if (!question) return;

            submitButton.disabled = true;
            showLoading();
            errorDiv.classList.add('d-none');
            answerDiv.innerText = '';
            answerDiv.classList.remove('text-muted');

            try {
                const response = await fetch(apiUrl + '?userPrompt=' + encodeURIComponent(question));

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ` + await response.text());
                }

                const text = await response.text();
                let data = null;
                try { data = JSON.parse(text); } catch (e) { /* plain text response */ }

                const content = data?.choices?.[0]?.message?.content
                             || data?.content || data?.answer || data || text;

                answerDiv.innerHTML = '';
                const pre = document.createElement('pre');
                pre.className = 'alert alert-light p-2 mb-0';
                pre.style.whiteSpace = 'pre-wrap';
                pre.style.wordBreak  = 'break-word';
                pre.textContent = String(content);
                answerDiv.appendChild(pre);

            } catch (error) {
                console.error(error);
                errorDiv.innerText = "An error occurred: " + error.message;
                errorDiv.classList.remove('d-none');
            } finally {
                submitButton.disabled = false;
                hideLoading();
            }
        }

        // ---------------------------------------------------------------
        // STREAMING: consume the /api/stream Server-Sent Events endpoint.
        // Each chunk is appended as it arrives for a live "typing" effect.
        // The answer div scrolls internally — the input stays visible.
        // ---------------------------------------------------------------
        function streamQuestion() {
            const question = questionInput.value.trim();
            if (!question) return;

            submitButton.disabled = true;
            streamButton.disabled = true;
            showLoading();
            errorDiv.classList.add('d-none');
            answerDiv.classList.remove('text-muted');

            answerDiv.innerHTML = '';
            const pre = document.createElement('pre');
            pre.className = 'alert alert-light p-2 mb-0';
            pre.style.whiteSpace = 'pre-wrap';
            pre.style.wordBreak  = 'break-word';
            answerDiv.appendChild(pre);

            const eventSource = new EventSource(streamUrl + '?userPrompt=' + encodeURIComponent(question));

            const finish = () => {
                eventSource.close();
                submitButton.disabled = false;
                streamButton.disabled = false;
                hideLoading();
            };

            eventSource.onmessage = (event) => {
                pre.textContent += event.data;
                answerDiv.scrollTop = answerDiv.scrollHeight; // follow the stream
            };

            eventSource.onerror = () => {
                if (!pre.textContent) {
                    errorDiv.innerText = "An error occurred while streaming.";
                    errorDiv.classList.remove('d-none');
                }
                finish();
            };
        }
    </script>
</body>

</html>
